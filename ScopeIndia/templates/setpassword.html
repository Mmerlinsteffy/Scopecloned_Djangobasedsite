{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#04145f,#0b1e63);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .password-container{
            width:100%;
            max-width:450px;
            padding:20px;
        }
        .password-box{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }
        .password-box h1{
            text-align:center;
            color:#04145f;
            margin-bottom:10px;
            font-size:32px;
        }
        .password-box p{
            text-align:center;
            color:#555;
            margin-bottom:30px;
            line-height:1.6;
        }
        .input-group{
            margin-bottom:25px;
        }
        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#04145f;
        }
        .input-group input{
            width:100%;
            padding:14px;
            border:2px solid #d4d4d4;
            border-radius:8px;
            font-size:16px;
            transition:0.3s;
        }
        .input-group input:focus{
            border-color:#04145f;
            outline:none;
            box-shadow:0 0 8px rgba(4,20,95,0.3);
        }
        .save-btn{
            width:100%;
            padding:14px;
            background:linear-gradient(135deg,#04145f,#0b1e63);
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }
        .save-btn:hover{
            transform:translateY(-2px);
        }
    </style>
</head>
<body>
<div class="password-container">
    <div class="password-box">
     <h1>Create Password</h1>
        <p>
            Create your new password for future logins.
        </p>
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="password" placeholder="Enter new password" required>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="save-btn">
                Save Password
            </button>
<h3>{{error}}</h3>
        </form>
    </div>
</div>
</body>
</html>
