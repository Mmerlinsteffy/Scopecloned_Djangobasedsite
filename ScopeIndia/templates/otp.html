{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#04145f,#0b1e63);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .otp-container{
            width:100%;
            max-width:450px;
            padding:20px;
        }

        .otp-box{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .otp-box h1{
            text-align:center;
            color:#04145f;
            margin-bottom:10px;
            font-size:32px;
        }

        .otp-box p{
            text-align:center;
            color:#555;
            margin-bottom:30px;
            line-height:1.6;
        }

        .input-group{
            margin-bottom:25px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#04145f;
        }

        .input-group input{
            width:100%;
            padding:14px;
            border:2px solid #d4d4d4;
            border-radius:8px;
            font-size:16px;
            transition:0.3s;
            text-align:center;
            letter-spacing:5px;
        }

        .input-group input:focus{
            border-color:#04145f;
            outline:none;
            box-shadow:0 0 8px rgba(4,20,95,0.3);
        }

        .verify-btn{
            width:100%;
            padding:14px;
            background:linear-gradient(135deg,#04145f,#0b1e63);
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .verify-btn:hover{
            transform:translateY(-2px);
        }

        .resend{
            margin-top:20px;
            text-align:center;
        }

        .resend a{
            text-decoration:none;
            color:#04145f;
            font-weight:bold;
        }

        .resend a:hover{
            color:goldenrod;
        }

    </style>

</head>
<body>

<div class="otp-container">
    <div class="otp-box">
        <h1>OTP Verification</h1>
        <p>
            Enter the OTP sent to your registered email address.
        </p>
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>Enter OTP</label>
                <input type="text" name="otp" maxlength="6" required>
            </div>
            <button type="submit" class="verify-btn">
                Verify OTP
            </button>
      <h3>{{error}}</h3>
        </form>
    </div>
</div>

</body>
</html>
